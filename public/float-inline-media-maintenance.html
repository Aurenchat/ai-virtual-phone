<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Float · 旧版聊天媒体体检</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 24px 16px; background: Canvas; color: CanvasText; }
    main { max-width: 760px; margin: auto; }
    h1 { font-size: 24px; } p { line-height: 1.6; }
    .notice { border: 2px solid #b77716; border-radius: 12px; padding: 16px; }
    .notice strong { display: block; font-size: 18px; }
    button { font: inherit; padding: 12px 16px; border-radius: 8px; margin: 8px 8px 8px 0; cursor: pointer; }
    button:disabled { cursor: default; opacity: .55; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; font-size: 14px; }
    #status { min-height: 24px; } textarea { width: 100%; min-height: 260px; box-sizing: border-box; }
  </style>
  <script type="module" src="/float-inline-media-maintenance.js"></script>
</head>
<body><main>
  <h1>旧版聊天媒体体检</h1>
  <div class="notice"><strong>只读模式 · 当前不会修改任何数据</strong>
    <p>PREVIEW ONLY</p>
    <p>当前手机数据没有备份。正式迁移功能已锁定，完成完整备份后再启用。</p>
  </div>
  <p>逐条检查聊天媒体引用和媒体库大小，不解码图片或语音，不读取聊天正文。扫描期间请保持此页面打开。</p>
  <button id="scan" type="button">开始只读扫描</button>
  <button id="copy" type="button" disabled>复制报告</button>
  <button id="migration-locked" type="button" disabled>正式迁移：备份后开放</button>
  <p id="status" role="status" aria-live="polite">尚未扫描。</p>
  <pre id="report"></pre>
  <textarea id="copy-fallback" readonly hidden aria-label="可手动复制的体检报告"></textarea>
</main></body>
</html>
